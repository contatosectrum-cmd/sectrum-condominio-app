    <title>Sectrum — Acesso</title>
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new Event('sectrum:pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredPwaPrompt = null;
        window.dispatchEvent(new Event('sectrum:pwa-installed'));
      });
    </script>
    <script src="/video-rtc.js?v=20261017a"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw-push.js?v=20261022v14', { scope: '/', updateViaCache: 'none' })
            .then((r) => {
              r.update();
              window.addEventListener('focus', () => r.update());
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
