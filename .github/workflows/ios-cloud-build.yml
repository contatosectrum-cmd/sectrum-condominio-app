name: Build Nativo iOS e Publicar no App Store Connect

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Compilar, Assinar e Enviar para App Store Connect (macOS-15)
    runs-on: macos-15
    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Certificado Apple Distribution e Provisioning Profile
        env:
          APPLE_CER_BASE64: ${{ secrets.APPLE_CER_BASE64 }}
          APPLE_KEY_BASE64: ${{ secrets.APPLE_KEY_BASE64 }}
          APPLE_PROVISION_BASE64: ${{ secrets.APPLE_PROVISION_BASE64 }}
          APPLE_PROFILE_UUID: ${{ secrets.APPLE_PROFILE_UUID }}
        run: |
          KEYCHAIN_PASS="SectrumKeychain2026!"
          echo "$APPLE_CER_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.pem"
          echo "$APPLE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.key"

          # Gerar PKCS#12 compatível usando o LibreSSL/OpenSSL nativo do macOS
          /usr/bin/openssl pkcs12 -export -legacy \
            -inkey "$RUNNER_TEMP/dist.key" \
            -in "$RUNNER_TEMP/dist.pem" \
            -out "$RUNNER_TEMP/dist.p12" \
            -passout "pass:$KEYCHAIN_PASS" || \
          /usr/bin/openssl pkcs12 -export \
            -inkey "$RUNNER_TEMP/dist.key" \
            -in "$RUNNER_TEMP/dist.pem" \
            -out "$RUNNER_TEMP/dist.p12" \
            -passout "pass:$KEYCHAIN_PASS"

          # Criar e desbloquear keychain de compilação
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db

          # Baixar e importar autoridade intermediária WWDR G3 da Apple
          curl -sL "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k build.keychain -T /usr/bin/codesign -T /usr/bin/security

          # Importar Certificado e Chave Privada
          security import "$RUNNER_TEMP/dist.p12" -k build.keychain -P "$KEYCHAIN_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" build.keychain
          security find-identity -v -p codesigning build.keychain

          # Instalar Provisioning Profile da App Store
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROVISION_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/${APPLE_PROFILE_UUID}.mobileprovision"

      - name: Instalar dependências Web e sincronizar Capacitor iOS
        run: |
          if [ -d "projeto-react/frontend" ]; then
            cd projeto-react/frontend
          fi
          npm ci || npm install
          npm run build
          npx cap copy ios

      - name: Arquivar e Assinar App Nativo iOS (Xcode Archive + Export IPA)
        run: |
          if [ -d "projeto-react/frontend/ios/App" ]; then
            cd projeto-react/frontend/ios/App
          else
            cd ios/App
          fi
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Sectrum.xcarchive"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Sectrum.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

          cp "$RUNNER_TEMP/export/App.ipa" ./Sectrum-Condominio-iOS.ipa

      - name: Enviar Build para Apple App Store Connect / TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -d "projeto-react/frontend/ios/App" ]; then
            cd projeto-react/frontend/ios/App
          else
            cd ios/App
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf "%s" "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "./Sectrum-Condominio-iOS.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Disponibilizar Sectrum-Condominio-iOS.ipa Assinado nos Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sectrum-Condominio-iOS-IPA
          path: "**/Sectrum-Condominio-iOS.ipa"
          retention-days: 30
